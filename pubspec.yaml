name: pa_device_ai

description: Private on-device AI adapter for Android and iOS.

version: 0.1.0

publish_to: none



environment:

 sdk: '>=3.8.0 <4.0.0'

 flutter: '>=3.32.0'



dependencies:

 flutter:

   sdk: flutter



dev_dependencies:

 flutter_test:

   sdk: flutter



flutter:

 plugin:

   platforms:

     android:

       package: ai.pa.device

       pluginClass: PaDeviceAiPlugin

     ios:

       pluginClass: PaDeviceAiPlugin
